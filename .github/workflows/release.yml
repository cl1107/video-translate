name: Release NSH

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.9.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build NSH macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: npm install --global pnpm@11.17.0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const fs = require('node:fs');
          const version = require('./apps/nsh/nsh.json').version;
          const cargo = fs.readFileSync('apps/nsh/Cargo.toml', 'utf8').match(/^version = \"([^\"]+)\"/m)?.[1];
          if (cargo !== version || process.env.RELEASE_TAG !== 'v' + version) {
            console.error('Release tag, nsh.json and Cargo.toml versions must agree'); process.exit(1);
          }"

      - name: Install NSH stable toolchain
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://nsh.dev/install.sh -o "$RUNNER_TEMP/install-nsh.sh"
          sh "$RUNNER_TEMP/install-nsh.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify native build tools
        run: |
          rustc --version
          cargo --version
          nsh --version

      - name: Install dependencies
        # NSH does not use Electron's postinstall/native rebuild hooks.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run NSH tests
        run: nsh test apps/nsh

      - name: Build NSH release archive
        run: pnpm make:release

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-nsh-macos-arm64
          path: apps/nsh/.nsh/release/v*/*.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Need full history + tags so commit-based notes fallback can git log
          # previous_tag..RELEASE_TAG when GitHub --generate-notes has no PRs.
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-nsh-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found to upload" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            # GitHub auto notes (PR list); when there are no merged PRs,
            # --generate-notes is often only a Full Changelog link.
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --title "$RELEASE_TAG"
          fi
          # 每次发布都整理 notes，并固定写入 NSH 安装说明
          #（feat/fix/docs 分组 + scripts/release-notes-preamble.md）
          tmp_dir="$(mktemp -d)"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$tmp_dir/generated.md"
          if node scripts/organize-release-notes.mjs --tag "$RELEASE_TAG" "$tmp_dir/generated.md" > "$tmp_dir/organized.md"; then
            gh release edit "$RELEASE_TAG" --notes-file "$tmp_dir/organized.md"
          else
            echo "Warning: could not organize release notes; keeping existing body" >&2
          fi
