[package]
name = "nsh-app-video-translate"
version = "0.9.0"
edition = "2024"
publish = false
default-run = "nsh-app-video-translate"

[workspace]

[lib]
name = "nsh_app_video_translate"
path = "src/lib.rs"

[[bin]]
name = "nsh-app-video-translate"
path = "src/main.rs"

[[bin]]
name = "vt"
path = "src/bin/vt.rs"

[dependencies]
base64 = "0.22"
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=2.0.1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.5.0", default-features = false }
nsh-testing = { version = "0.5.0", default-features = false, features = ["live"] }
tempfile = "3"
